<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MedPoint — Offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f1f5f9; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  .card { max-width: 360px; text-align: center; padding: 32px 24px; }
  .logo { width: 56px; height: 56px; border-radius: 14px; background: #1d4ed8; color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px;
    margin: 0 auto 16px; }
  h1 { font-size: 18px; color: #0f172a; margin: 0 0 8px; }
  p { font-size: 14px; color: #64748b; margin: 0 0 20px; line-height: 1.5; }
  button { background: #1d4ed8; color: #fff; border: none; border-radius: 10px; padding: 10px 20px;
    font-size: 14px; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">MP</div>
    <h1>No internet connection</h1>
    <p>This page hasn't been loaded before, so it isn't saved on your phone yet. Anything you've already opened — your cart, catalog, and recent orders — is still available. Reconnect to see this page.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
